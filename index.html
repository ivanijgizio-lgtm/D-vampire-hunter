<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Кровь и Вера · Карта Европы 1520</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', monospace;
      padding: 20px;
    }
    .game-container {
      background: #1e1a17;
      border: 6px solid #4a3724;
      box-shadow: 0 10px 30px black;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      display: block;
      border: 4px solid #33261b;
      border-radius: 6px;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      background: #dac29c;
      width: 1000px;
      height: 700px;
      cursor: crosshair;
      box-shadow: inset 0 0 20px black;
    }
    .panel {
      width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding: 10px 15px;
      background: #251e18;
      border: 3px solid #4a3724;
      border-radius: 30px;
      color: #f0d9a8;
      font-weight: bold;
      font-size: 1.1rem;
      box-shadow: 0 4px 0 #0f0a05;
      gap: 15px;
      flex-wrap: wrap;
    }
    .resources { display: flex; gap: 25px; }
    .blood { color: #e03a3a; text-shadow: 0 0 8px #8b0000; }
    .faith { color: #ffd966; text-shadow: 0 0 8px #b8860b; }
    button {
      background: #3e2e1f;
      border: 3px solid #5e4a34;
      color: #ffdead;
      padding: 8px 14px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 3px 0 #1f140a;
      transition: 0.1s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    button:hover {
      background: #5a4430;
      border-color: #b9935a;
      box-shadow: 0 3px 0 #3d2b1a, 0 0 12px #f0b050;
    }
    button:disabled { opacity: 0.5; pointer-events: none; filter: grayscale(0.5); }
    .log {
      width: 1000px;
      margin-top: 10px;
      background: #12100c;
      border: 2px solid #5e4a34;
      border-radius: 20px;
      padding: 8px 15px;
      color: #c9b185;
      font-size: 0.85rem;
      min-height: 40px;
      box-shadow: inset 0 2px 8px black;
    }
    #tooltip {
      position: absolute;
      background: #1e140c;
      border: 2px solid #d4af37;
      color: #f9eec1;
      padding: 10px 16px;
      font-family: 'Courier New', monospace;
      border-radius: 8px;
      pointer-events: none;
      display: none;
      z-index: 100;
      white-space: pre-line;
      box-shadow: 0 8px 20px black;
    }
  </style>
</head>
<body>
<div style="position: relative;">
  <div class="game-container">
    <canvas id="gameCanvas" width="1000" height="700"></canvas>
    <div class="panel" id="infoPanel">
      <div>🌅 ХОД: <span id="turnDisplay">1</span> <span id="dayNightIcon">☀️ ДЕНЬ</span></div>
      <div class="resources">
        <span class="blood">🩸 КРОВЬ: <span id="bloodAmount">3</span></span>
        <span class="faith">✝️ ВЕРА: <span id="faithAmount">5</span></span>
      </div>
      <div>🏴 ЗАХВАЧЕНО: <span id="capturePercent">6%</span></div>
      <div>
        <button id="feastBtn" title="Кровавый пир (+15 силы Дракуле, стоимость 5 крови, на тёмной земле)">🍷 ПИР</button>
        <button id="spawnServantBtn" title="Призвать слуг (5 крови)">🧛 СЛУГИ</button>
        <button id="buildChurchBtn" title="Церковь Ночи (12 крови, на тёмной земле)">🕍 ЦЕРКОВЬ</button>
        <button id="musicToggleBtn">🎵 МУЗЫКА</button>
        <button id="nextTurnBtn">⏩ ХОД</button>
      </div>
    </div>
    <div class="log" id="logPanel">📜 Дракула пробуждается в Трансильвании...</div>
  </div>
  <div id="tooltip"></div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ---------- ПОЛИГОНЫ ПРОВИНЦИЙ (Европа) ----------
    const provincesPoly = [
      { id: 0, name: 'Англия', neighbors: [1,4], points: [{x:70,y:60},{x:180,y:65},{x:200,y:120},{x:160,y:170},{x:80,y:160},{x:50,y:110}] },
      { id: 1, name: 'Швеция', neighbors: [0,2,5], points: [{x:210,y:30},{x:340,y:45},{x:360,y:120},{x:290,y:155},{x:220,y:130},{x:190,y:80}] },
      { id: 2, name: 'Польша', neighbors: [1,3,5,6], points: [{x:370,y:55},{x:500,y:70},{x:530,y:140},{x:460,y:175},{x:380,y:150},{x:350,y:100}] },
      { id: 3, name: 'Пруссия', neighbors: [2,6,7], points: [{x:540,y:80},{x:680,y:90},{x:700,y:150},{x:620,y:170},{x:550,y:140},{x:520,y:100}] },
      { id: 4, name: 'Франция', neighbors: [0,5,9,10], points: [{x:60,y:190},{x:170,y:195},{x:210,y:270},{x:160,y:330},{x:70,y:310},{x:30,y:240}] },
      { id: 5, name: 'Саксония', neighbors: [1,2,4,6,10], points: [{x:220,y:170},{x:320,y:180},{x:340,y:260},{x:270,y:310},{x:200,y:290},{x:180,y:220}] },
      { id: 6, name: 'Богемия', neighbors: [2,3,5,7,11], points: [{x:360,y:180},{x:470,y:190},{x:480,y:270},{x:420,y:310},{x:350,y:280},{x:330,y:220}] },
      { id: 7, name: 'Венгрия', neighbors: [3,6,8,11,12,13], points: [{x:530,y:200},{x:680,y:220},{x:710,y:290},{x:630,y:330},{x:540,y:300},{x:510,y:240}] },
      { id: 8, name: 'Молдавия', neighbors: [7,13,14], points: [{x:720,y:220},{x:830,y:240},{x:850,y:310},{x:780,y:340},{x:710,y:300}] },
      { id: 9, name: 'Кастилия', neighbors: [4,10,15], points: [{x:30,y:330},{x:110,y:340},{x:140,y:420},{x:100,y:470},{x:40,y:460},{x:10,y:390}] },
      { id: 10, name: 'Швабия', neighbors: [4,5,9,11,15,16], points: [{x:160,y:340},{x:240,y:350},{x:260,y:420},{x:210,y:480},{x:140,y:470},{x:120,y:400}] },
      { id: 11, name: 'Бавария', neighbors: [6,7,10,12], points: [{x:360,y:320},{x:430,y:330},{x:450,y:400},{x:380,y:440},{x:320,y:410},{x:310,y:360}] },
      { id: 12, name: 'Австрия', neighbors: [7,11,13,15], points: [{x:470,y:340},{x:560,y:350},{x:580,y:420},{x:500,y:460},{x:430,y:430},{x:420,y:380}] },
      { id: 13, name: 'Трансильвания', neighbors: [7,8,12,14,17], points: [{x:630,y:360},{x:760,y:380},{x:780,y:460},{x:690,y:500},{x:590,y:470},{x:580,y:400}] },
      { id: 14, name: 'Валахия', neighbors: [8,13,17], points: [{x:790,y:380},{x:890,y:400},{x:910,y:470},{x:830,y:500},{x:750,y:460}] },
      { id: 15, name: 'Папская обл.', neighbors: [9,10,12,16], points: [{x:100,y:490},{x:180,y:500},{x:190,y:560},{x:140,y:600},{x:80,y:590},{x:60,y:540}] },
      { id: 16, name: 'Неаполь', neighbors: [10,15,17], points: [{x:200,y:500},{x:290,y:510},{x:300,y:580},{x:230,y:610},{x:160,y:590},{x:150,y:540}] },
      { id: 17, name: 'Османская имп.', neighbors: [13,14,16], points: [{x:320,y:510},{x:550,y:530},{x:580,y:620},{x:450,y:650},{x:300,y:620},{x:280,y:560}] }
    ];

    function getCentroid(points) {
      let cx = 0, cy = 0;
      points.forEach(p => { cx += p.x; cy += p.y; });
      return { x: cx / points.length, y: cy / points.length };
    }

    // Игровые константы
    const START_POWER = 100;
    const PLAYER_START = 13;
    const AI_START = [12,15,4];

    // Состояние игры
    let game = {
      turn: 1,
      night: false,
      blood: 3,
      faith: 5,
      crusade: 0,
      ghouls: [],
      servants: [],
      playerArmy: { loc: PLAYER_START, power: START_POWER },
      aiArmies: [
        { id: 0, loc: 12, power: START_POWER },
        { id: 1, loc: 15, power: START_POWER },
        { id: 2, loc: 4, power: START_POWER }
      ],
      provinces: provincesPoly.map(p => ({
        ...p,
        centroid: getCentroid(p.points),
        owner: 'neutral',
        dark: false,
        holy: false,
        cathedral: false,
        darkChurch: false
      })),
      gameOver: false,
      winner: null,
      log: ['Дракула пробуждается в Трансильвании...']
    };

    game.provinces[PLAYER_START].owner = 'player';
    game.provinces[PLAYER_START].dark = true;
    AI_START.forEach(id => {
      game.provinces[id].owner = 'ai';
      game.provinces[id].holy = true;
    });
    game.provinces[15].cathedral = true;

    function addLog(msg) {
      game.log.unshift(msg);
      if (game.log.length > 4) game.log.pop();
      document.getElementById('logPanel').innerHTML = '📜 ' + game.log.join(' &nbsp;|&nbsp; ');
    }

    function getProv(id) { return game.provinces.find(p => p.id === id); }
    function isAdjacent(id1, id2) { return getProv(id1)?.neighbors.includes(id2); }

    // Бой со случайностью
    function fight(attPower, defPower, provId, attIsPlayer) {
      const prov = getProv(provId);
      let attMod = 1.0, defMod = 1.0;
      if (prov.dark) { if (attIsPlayer) attMod *= 10; else defMod *= 10; }
      if (prov.holy) { if (attIsPlayer) attMod *= 0.5; else defMod *= 0.5; }
      if (prov.cathedral && !attIsPlayer) defMod *= 1.5;
      if (prov.darkChurch && attIsPlayer) defMod *= 1.4;
      if (game.night && attIsPlayer) attMod *= 1.5;
      if (!game.night && attIsPlayer && prov.holy) attMod *= 0.7;
      if (game.crusade > 0 && !attIsPlayer) attMod *= 2.0;

      const attRoll = attPower * attMod * (0.8 + Math.random() * 0.4);
      const defRoll = defPower * defMod * (0.8 + Math.random() * 0.4);
      return attRoll > defRoll;
    }

    // Действия игрока
    function movePlayer(targetId) {
      if (game.gameOver) return;
      const curr = game.playerArmy.loc;
      if (!isAdjacent(curr, targetId) && curr !== targetId) {
        addLog('⛔ Не граничит с вашей провинцией!');
        return;
      }
      const tProv = getProv(targetId);
      if (tProv.owner === 'player') {
        game.playerArmy.loc = targetId;
        addLog(`🦇 Дракула в ${tProv.name}`);
        draw();
        return;
      }
      let defPow = 25;
      if (tProv.owner === 'ai') {
        const aiA = game.aiArmies.find(a => a.loc === targetId);
        defPow = aiA ? aiA.power : 30;
      }
      const win = fight(game.playerArmy.power, defPow, targetId, true);
      if (win) {
        tProv.owner = 'player';
        tProv.dark = true;
        tProv.holy = false;
        tProv.cathedral = false;
        game.playerArmy.loc = targetId;
        game.playerArmy.power = Math.min(game.playerArmy.power + 15, 200);
        game.aiArmies = game.aiArmies.filter(a => a.loc !== targetId);
        addLog(`🩸 Захвачена ${tProv.name}! +15 силы.`);
      } else {
        game.playerArmy.power = Math.max(10, game.playerArmy.power - 25);
        addLog(`💔 Поражение. Дракула теряет 25 воинов.`);
        if (game.playerArmy.power <= 10) {
          game.gameOver = true; game.winner = 'ai';
          addLog('💀 Дракула разбит!');
        }
      }
      checkVictory();
      draw();
      updateUI();
    }

    function feast() {
      if (game.gameOver || game.blood < 5) return;
      const p = getProv(game.playerArmy.loc);
      if (!p || !p.dark) { addLog('🍷 Пир возможен только на тёмной земле!'); return; }
      game.blood -= 5;
      game.playerArmy.power = Math.min(game.playerArmy.power + 20, 250);
      addLog('🍷 Кровавый пир! +20 силы Дракуле.');
      updateUI();
      draw();
    }

    function spawnServant() {
      if (game.gameOver || game.blood < 5) return;
      game.blood -= 5;
      game.servants.push({ loc: game.playerArmy.loc, power: 12 });
      addLog('🧛 Призваны слуги вампира (сила 12).');
      updateUI();
      draw();
    }

    function buildDarkChurch() {
      if (game.gameOver || game.blood < 12) return;
      const p = getProv(game.playerArmy.loc);
      if (!p || !p.dark || p.darkChurch) { addLog('🕍 Нельзя построить Церковь Ночи здесь.'); return; }
      game.blood -= 12;
      p.darkChurch = true;
      addLog(`🕍 Церковь Ночи возведена в ${p.name}!`);
      updateUI();
      draw();
    }

    // ИИ
    function aiTurn() {
      if (game.gameOver) return;
      game.faith += game.provinces.filter(p => p.owner === 'ai').length * 2;
      game.blood += game.provinces.filter(p => p.owner === 'player').length + 
                   game.provinces.filter(p => p.owner === 'player' && p.darkChurch).length * 2;

      // Соборы
      if (game.faith >= 10) {
        const cand = game.provinces.filter(p => p.owner === 'ai' && !p.cathedral && p.holy);
        if (cand.length) {
          const t = cand[Math.floor(Math.random() * cand.length)];
          t.cathedral = true;
          game.faith -= 10;
          addLog(`⛪ Собор в ${t.name}!`);
        }
      }
      // Инквизиция
      if (game.faith >= 8 && game.provinces.some(p => p.owner === 'player' && p.holy)) {
        game.faith -= 8;
        game.playerArmy.power = Math.max(10, game.playerArmy.power - 15);
        game.servants.forEach(s => s.power = Math.max(1, s.power - 5));
        addLog('🔥 Инквизиция! Вампиры на святой земле теряют силы.');
      }
      // Крестовый поход
      if (game.faith >= 15 && game.crusade <= 0) {
        game.faith -= 15;
        game.crusade = 3;
        addLog('✝️ КРЕСТОВЫЙ ПОХОД! Удвоение атаки на 3 хода.');
      }
      if (game.crusade > 0) game.crusade--;

      // Рост армий ИИ
      game.aiArmies.forEach(a => {
        const prov = getProv(a.loc);
        if (prov && prov.cathedral) a.power = Math.min(a.power + 5, 180);
      });

      // Атаки ИИ
      game.aiArmies.forEach(army => {
        const n = getProv(army.loc).neighbors;
        const enemy = n.filter(id => getProv(id).owner === 'player');
        if (enemy.length) {
          const target = enemy[Math.floor(Math.random() * enemy.length)];
          const def = (game.playerArmy.loc === target) ? game.playerArmy.power : 
                      (game.servants.find(s => s.loc === target)?.power || 20);
          if (fight(army.power, def, target, false)) {
            const tp = getProv(target);
            tp.owner = 'ai'; tp.dark = false; tp.holy = true; tp.darkChurch = false;
            army.loc = target;
            army.power = Math.min(army.power + 10, 200);
            addLog(`🛡️ ИИ захватил ${tp.name}!`);
            if (game.playerArmy.loc === target) {
              game.playerArmy.power = Math.max(10, game.playerArmy.power - 30);
              game.playerArmy.loc = PLAYER_START;
            }
            game.servants = game.servants.filter(s => s.loc !== target);
          }
        }
      });
      checkVictory();
    }

    function checkVictory() {
      const owned = game.provinces.filter(p => p.owner === 'player').length;
      if (owned >= Math.floor(game.provinces.length * 0.8)) {
        game.gameOver = true; game.winner = 'player';
        addLog('🦇 Дракула покорил Европу!');
      }
    }

    function nextTurn() {
      if (game.gameOver) return;
      aiTurn();
      game.turn++;
      game.night = game.turn % 2 === 0;
      updateUI();
      draw();
      if (game.gameOver) document.getElementById('nextTurnBtn').disabled = true;
    }

    // Рисование
    function drawPoly(prov) {
      const pts = prov.points;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath();
      ctx.fillStyle = prov.dark ? '#4a0e1c' : (prov.holy ? '#2e4a6b' : '#5e5b52');
      ctx.fill();
      ctx.strokeStyle = '#2f2416';
      ctx.lineWidth = 3;
      ctx.stroke();
      
      ctx.font = 'bold 11px "Courier New"';
      ctx.fillStyle = 'white';
      ctx.shadowColor = 'black';
      ctx.shadowBlur = 4;
      ctx.fillText(prov.name, prov.centroid.x - 30, prov.centroid.y - 8);
      ctx.shadowBlur = 0;
      
      // Иконки
      const cx = prov.centroid.x, cy = prov.centroid.y;
      if (prov.cathedral) {
        ctx.fillStyle = '#f5e6d3'; ctx.fillRect(cx-5, cy+5, 10, 8);
        ctx.fillStyle = '#d4af37'; ctx.fillRect(cx-1, cy-2, 2, 8);
      } else if (prov.darkChurch) {
        ctx.fillStyle = '#4a0e1c'; ctx.fillRect(cx-6, cy+2, 12, 10);
        ctx.fillStyle = '#8b0000'; ctx.fillRect(cx-2, cy-4, 4, 8);
      } else if (prov.owner === 'player') {
        ctx.fillStyle = '#3a3a3a'; ctx.fillRect(cx-6, cy+4, 12, 8);
        ctx.fillStyle = '#8b0000'; ctx.fillRect(cx, cy, 6, 6);
      } else if (prov.owner === 'ai') {
        ctx.fillStyle = '#d4af37'; ctx.fillRect(cx-4, cy+2, 8, 10);
      } else {
        ctx.fillStyle = '#8b7355'; ctx.fillRect(cx-4, cy+4, 8, 6);
      }
    }

    function drawUnits() {
      // Игрок
      const pl = getProv(game.playerArmy.loc);
      ctx.fillStyle = '#111'; ctx.fillRect(pl.centroid.x-15, pl.centroid.y-25, 14, 16);
      ctx.fillStyle = '#8b0000'; ctx.fillRect(pl.centroid.x-20, pl.centroid.y-20, 8, 12);
      ctx.fillStyle = 'white'; ctx.font = 'bold 10px monospace';
      ctx.fillText(game.playerArmy.power, pl.centroid.x+5, pl.centroid.y-18);
      // Слуги
      game.servants.forEach(s => {
        const loc = getProv(s.loc);
        ctx.fillStyle = '#2f4f2f'; ctx.fillRect(loc.centroid.x-20, loc.centroid.y+5, 10, 10);
        ctx.fillText(s.power, loc.centroid.x-15, loc.centroid.y+20);
      });
      // ИИ
      game.aiArmies.forEach(a => {
        const loc = getProv(a.loc);
        ctx.fillStyle = '#f0f0f0'; ctx.fillRect(loc.centroid.x+5, loc.centroid.y-20, 12, 14);
        ctx.fillStyle = '#1e3a8a'; ctx.fillRect(loc.centroid.x+12, loc.centroid.y-18, 6, 12);
        ctx.fillText(a.power, loc.centroid.x+18, loc.centroid.y-15);
      });
    }

    function draw() {
      ctx.fillStyle = '#dac29c'; ctx.fillRect(0,0,1000,700);
      game.provinces.forEach(p => drawPoly(p));
      drawUnits();
      if (game.night) { ctx.fillStyle = 'rgba(10,10,30,0.3)'; ctx.fillRect(0,0,1000,700); }
    }

    // UI
    function updateUI() {
      document.getElementById('turnDisplay').textContent = game.turn;
      document.getElementById('dayNightIcon').innerHTML = game.night ? '🌙 НОЧЬ' : '☀️ ДЕНЬ';
      document.getElementById('bloodAmount').textContent = game.blood;
      document.getElementById('faithAmount').textContent = game.faith;
      const owned = game.provinces.filter(p => p.owner === 'player').length;
      document.getElementById('capturePercent').textContent = Math.floor(owned / game.provinces.length * 100) + '%';
      document.getElementById('feastBtn').disabled = game.blood < 5 || game.gameOver || !getProv(game.playerArmy.loc)?.dark;
      document.getElementById('spawnServantBtn').disabled = game.blood < 5 || game.gameOver;
      document.getElementById('buildChurchBtn').disabled = game.blood < 12 || game.gameOver || !getProv(game.playerArmy.loc)?.dark || getProv(game.playerArmy.loc)?.darkChurch;
    }

    // Тултип
    const tooltip = document.getElementById('tooltip');
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (1000 / rect.width);
      const my = (e.clientY - rect.top) * (700 / rect.height);
      let found = null;
      for (let p of game.provinces) {
        if (ctx.isPointInPath?.(...? нет, используем ручную проверку)
        // быстрая проверка по bounding box
        if (mx >= Math.min(...p.points.map(pt=>pt.x)) && mx <= Math.max(...p.points.map(pt=>pt.x)) &&
            my >= Math.min(...p.points.map(pt=>pt.y)) && my <= Math.max(...p.points.map(pt=>pt.y))) {
          found = p; break;
        }
      }
      if (found) {
        const owner = found.owner === 'player' ? 'Вампиры' : (found.owner === 'ai' ? 'Инквизиция' : 'Нейтралы');
        tooltip.innerHTML = `${found.name}<br>👑 ${owner}<br>🌑 Тьма: ${found.dark?'Да':'Нет'}<br>✝️ Святость: ${found.holy?'Да':'Нет'}<br>⛪ Собор: ${found.cathedral?'Да':'Нет'}<br>🕍 Ц.Ночи: ${found.darkChurch?'Да':'Нет'}`;
        tooltip.style.display = 'block';
        tooltip.style.left = e.clientX + 15 + 'px';
        tooltip.style.top = e.clientY - 40 + 'px';
      } else tooltip.style.display = 'none';
    });

    canvas.addEventListener('click', e => {
      if (game.gameOver) return;
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (1000 / rect.width);
      const my = (e.clientY - rect.top) * (700 / rect.height);
      for (let p of game.provinces) {
        const xs = p.points.map(pt=>pt.x), ys = p.points.map(pt=>pt.y);
        if (mx >= Math.min(...xs) && mx <= Math.max(...xs) && my >= Math.min(...ys) && my <= Math.max(...ys)) {
          movePlayer(p.id);
          break;
        }
      }
    });

    // Кнопки
    document.getElementById('nextTurnBtn').addEventListener('click', nextTurn);
    document.getElementById('feastBtn').addEventListener('click', feast);
    document.getElementById('spawnServantBtn').addEventListener('click', spawnServant);
    document.getElementById('buildChurchBtn').addEventListener('click', buildDarkChurch);

    // Музыка (упрощённая)
    let audioCtx = null, musicOn = true;
    function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }
    function playMelody(arr) {
      if (!audioCtx || !musicOn) return;
      const now = audioCtx.currentTime; let t = 0;
      arr.forEach(([f,d]) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'square'; o.frequency.value = f;
        g.gain.setValueAtTime(0.05, now+t); g.gain.exponentialRampToValueAtTime(0.001, now+t+d-0.01);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now+t); o.stop(now+t+d); t+=d;
      });
    }
    document.getElementById('musicToggleBtn').addEventListener('click', ()=>{
      musicOn = !musicOn;
      document.getElementById('musicToggleBtn').textContent = musicOn ? '🎵 МУЗЫКА' : '🔇 БЕЗ ЗВУКА';
    });
    setInterval(() => {
      if (musicOn && !game.gameOver) {
        initAudio();
        playMelody(game.night ? [[220,0.2],[277,0.2],[329,0.3]] : [[523,0.15],[587,0.15],[659,0.2]]);
      }
    }, 2500);

    updateUI();
    draw();
    addLog('🦇 Вампиры начинают вторжение. Инквизиция на страже.');
  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Война Теней: Крестовый поход (1520)</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <div id="bg-layer"></div>
        
        <div id="main-area">
            <div id="top-bar">
                <div class="stat">⚔️ ХОД: <span id="turn-counter">1</span></div>
                <div class="stat">☀️ ДЕНЬ: <span id="day-counter">1</span></div>
                <div class="stat">⚡ Действия: <span id="ap-counter">2/2</span></div>
                <div class="stat">🩸 Кровь: <span id="blood-counter">10</span></div>
                <div class="stat">💰 Золото: <span id="gold-counter">100</span></div>
                <div class="stat">🧛 Генералы: <span id="elite-counter">5</span></div>
                <div id="faith-container">
                    <span>⛪ ВЕРА ВАТИКАНА</span>
                    <div id="faith-bar-bg"><div id="faith-bar-fill"></div></div>
                    <span id="faith-text">0 / 100</span>
                </div>
            </div>
            <canvas id="game-canvas" width="680" height="550"></canvas>
            <div id="ui-panel">
                <div id="action-buttons">
                    <button id="btn-assault" class="action-btn" disabled>💥 ШТУРМ</button>
                    <div class="dropdown">
                        <button class="action-btn">🏗️ СТРОИТЬ</button>
                        <div class="dropdown-content">
                            <button id="build-grave" class="sub-btn">⚰️ Фаб. гробов Lv1 (30🪙)</button>
                            <button id="build-grave-2" class="sub-btn">⚰️⬆️ Фаб. гробов Lv2 (50🪙)</button>
                            <button id="build-feast" class="sub-btn">🍷 Пир. зал Lv1 (20🪙)</button>
                            <button id="build-feast-2" class="sub-btn">🍷⬆️ Пир. зал Lv2 (40🪙)</button>
                            <button id="build-ritual" class="sub-btn">🕯️ Храм Тьмы (25🪙)</button>
                            <button id="build-castle" class="sub-btn">🏰 Замок (40🪙)</button>
                        </div>
                    </div>
                    <div class="dropdown">
                        <button class="action-btn">🧛 ПРИЗВАТЬ</button>
                        <div class="dropdown-content">
                            <button id="recruit-inf" class="sub-btn">🗡️ 5 Пехоты (10🪙)</button>
                            <button id="recruit-arch" class="sub-btn">🏹 5 Лучников (15🪙)</button>
                            <button id="recruit-cav" class="sub-btn">🐴 3 Кавалерии (20🪙)</button>
                        </div>
                    </div>
                    <div class="dropdown">
                        <button class="action-btn garrison-btn">🛡️ ГАРНИЗОН</button>
                        <div class="dropdown-content">
                            <button id="btn-garrison-add" class="sub-btn">⬆️ ОСТАВИТЬ (10 бойцов)</button>
                            <button id="btn-garrison-take" class="sub-btn">⬇️ ПРИЗВАТЬ (10 бойцов)</button>
                        </div>
                    </div>
                    <button id="btn-cancel-siege" class="action-btn">🚫 СНЯТЬ</button>
                    <button id="btn-end-turn" class="action-btn main-action">⏩ СЛЕД. ХОД</button>
                </div>
            </div>
        </div>

        <!-- Правая колонка -->
        <div id="log-sidebar">
            <h3>📜 ХРОНИКИ ТЬМЫ</h3>
            <div id="log-container"></div>
        </div>
    </div>

    <div id="tooltip"></div>

    <!-- Модальное окно выбора: ОСАДИТЬ или АТАКОВАТЬ -->
    <div id="action-modal" class="modal">
        <div class="modal-content">
            <h2>🏰 ВАРВАРЫ У ВОРОТ!</h2>
            <p id="action-desc">Ваша армия вошла в провинцию. Что делать?</p>
            <div id="action-options">
                <button id="btn-siege" class="action-btn" style="border-color: #d4af37;">🚩 ОСАДИТЬ (1 AP)</button>
                <button id="btn-assault-now" class="action-btn main-action">⚔️ АТАКОВАТЬ (1 AP)</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно выбора судьбы провинции (3 кнопки) -->
    <div id="surrender-modal" class="modal">
        <div class="modal-content">
            <h2>🏰 ПРОВИНЦИЯ ЗАХВАЧЕНА!</h2>
            <p>Население побеждено. Какова ваша воля?</p>
            <div id="surrender-options">
                <button id="btn-exterminate" class="action-btn main-action" style="background:#8b0000;">💀 ИСТРЕБИТЬ</button>
                <button id="btn-enslave" class="action-btn" style="background:#333; border-color:#555;">⛓️ ПОРАБОТИТЬ</button>
                <button id="btn-convert" class="action-btn" style="background:#2d2d2d; border-color:#8b0000;">🧛 ОБРАТИТЬ</button>
            </div>
            <p id="surrender-result" style="margin-top:10px; font-size:14px; color:#aaa;"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

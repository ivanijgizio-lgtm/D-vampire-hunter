<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Кровь и Вера · Война Теней 1520</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div style="position: relative;">
    <div class="game-container">
        <canvas id="gameCanvas" width="1000" height="700" aria-label="Карта Европы 1520 года"></canvas>
        <div class="panel">
            <div>🌅 ХОД: <span id="turnDisplay">1</span> <span id="dayNightIcon">☀️ ДЕНЬ</span></div>
            <div class="resources">
                <span class="blood">🩸 КРОВЬ: <span id="bloodAmount">3</span></span>
                <span class="faith">✝️ ВЕРА: <span id="faithAmount">5</span></span>
            </div>
            <div>🏴 ЗАХВАЧЕНО: <span id="capturePercent">6%</span></div>
            <div>
                <button id="feastBtn" title="Кровавый пир (+20 силы Дракуле, 5 крови, на тёмной земле)">🍷 ПИР</button>
                <button id="spawnServantBtn" title="Призвать слуг вампира (5 крови)">🧛 СЛУГИ</button>
                <button id="buildChurchBtn" title="Церковь Ночи (12 крови, на тёмной земле)">🕍 ЦЕРКОВЬ</button>
                <button id="musicToggleBtn">🎵 МУЗЫКА</button>
                <button id="nextTurnBtn">⏩ ХОД</button>
            </div>
        </div>
        <div class="log" id="logPanel">📜 Дракула пробуждается в Трансильвании...</div>
    </div>
    <div id="tooltip"></div>
</div>
<script src="script.js"></script>
</body>
</html>

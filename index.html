<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Готическая Стратегия: Война Теней</title>
    <link rel="stylesheet" href="style.css">
    <!-- Используем готический шрифт из Google Fonts для атмосферы -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <!-- Фоновый слой для готического замка -->
        <div id="bg-layer"></div>

        <!-- Игровой холст для карты и юнитов -->
        <canvas id="game-canvas" width="800" height="600"></canvas>

        <!-- Нижняя панель интерфейса -->
        <div id="ui-panel">
            <div id="status-bar">
                <div class="stat"><span class="icon">⚔️</span> ХОД: <span id="turn-counter">1</span></div>
                <div class="stat"><span class="icon">☀️</span> ДЕНЬ: <span id="day-counter">1</span></div>
                <div class="stat"><span class="icon">⚡</span> Действия: <span id="ap-counter">2/2</span></div>
                <div class="stat"><span class="icon">🩸</span> Кровь: <span id="blood-counter">5</span></div>
                <div class="stat"><span class="icon">💰</span> Золото: <span id="gold-counter">5</span></div>
                <div class="stat"><span class="icon">🛡️</span> Элита: <span id="elite-counter">0</span></div>
            </div>

            <div id="action-buttons">
                <button id="btn-raid" class="action-btn">⚔️ НАБЕГ</button>
                <button id="btn-siege" class="action-btn" disabled>🏰 ОСАДА</button>
                <button id="btn-assault" class="action-btn" disabled>💥 ШТУРМ</button>
                <button id="btn-build" class="action-btn">🏗️ СТРОИТЬ</button>
                <button id="btn-recruit" class="action-btn">🧛 НАНЯТЬ</button>
                <button id="btn-cancel-siege" class="action-btn">🚫 СНЯТЬ</button>
                <button id="btn-end-turn" class="action-btn main-action">⏩ ХОД</button>
            </div>
        </div>

        <!-- Лог событий -->
        <div id="log-panel">
            <div id="log-container">
                <div class="log-entry">Принёс война тень...</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
